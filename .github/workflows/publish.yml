name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  # ─── Lint, format & test ─────────────────────────────────────────────────────
  check:
    name: Lint, Format & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check napi feature compiles
        run: cargo check --features napi

      - name: Check wasm feature compiles
        run: cargo check --lib --features wasm --no-default-features --target wasm32-unknown-unknown

  # ─── TypeScript typecheck, lint & format ─────────────────────────────────────
  check-ts:
    name: TypeScript Typecheck, Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  # ─── CLI binary build ─────────────────────────────────────────────────────────
  build-cli:
    name: Build CLI ${{ matrix.target }}
    needs: [check, check-ts]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_pkg: darwin-arm64
            binary: svg2font
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            npm_pkg: darwin-x64
            binary: svg2font
            archive_ext: tar.gz

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: linux-x64
            binary: svg2font
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm_pkg: linux-arm64
            binary: svg2font
            archive_ext: tar.gz
            use_cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm_pkg: win32-x64
            binary: svg2font.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          asset="svg2font-${GITHUB_REF_NAME}-${{ matrix.npm_pkg }}"
          staged="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${staged}/${{ matrix.binary }}"
          cd "${staged}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            zip -q "${asset}.zip" "${{ matrix.binary }}"
            mv "${asset}.zip" "${GITHUB_WORKSPACE}/${asset}.zip"
          else
            tar -czf "${asset}.tar.gz" "${{ matrix.binary }}"
            mv "${asset}.tar.gz" "${GITHUB_WORKSPACE}/${asset}.tar.gz"
          fi

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.npm_pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload CLI release asset
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.npm_pkg }}
          path: svg2font-${{ github.ref_name }}-${{ matrix.npm_pkg }}.${{ matrix.archive_ext }}

  # ─── WASM build ───────────────────────────────────────────────────────────────
  build-wasm:
    name: Build WASM
    needs: [check, check-ts]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target nodejs --out-dir packages/svg2font/wasm --out-name svg2font_wasm -- --features wasm --no-default-features

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg2font-wasm
          path: packages/svg2font/wasm/

  # ─── GitHub release assets (curl | bash install) ─────────────────────────────
  release:
    name: Attach release assets
    needs: [build-cli, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI release assets
        uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true

      - name: Build svg2font-manifest
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ github.ref_name }}"
          {
            printf 'version: %s\n' "${ver}"
            for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
              ext="tar.gz"
              [ "$target" = "win32-x64" ] && ext="zip"
              printf '%s: svg2font-%s-%s.%s\n' "${target}" "${ver}" "${target}" "${ext}"
            done
          } > svg2font-manifest
          cat svg2font-manifest

      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo jaysonwu991/svg2font >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo jaysonwu991/svg2font \
                 --title "${{ github.ref_name }}" --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find assets -type f -exec gh release upload "${{ github.ref_name }}" --repo jaysonwu991/svg2font --clobber {} \;
          gh release upload "${{ github.ref_name }}" --repo jaysonwu991/svg2font --clobber svg2font-manifest

  # ─── Publish ──────────────────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    needs: [check, check-ts, build-cli, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli-artifacts

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: svg2font-wasm
          path: packages/svg2font/wasm

      - name: Place CLI binaries into packages
        shell: bash
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            cp cli-artifacts/cli-$pkg/svg2font packages/svg2font-cli/npm/$pkg/svg2font
            chmod +x packages/svg2font-cli/npm/$pkg/svg2font
          done
          cp cli-artifacts/cli-win32-x64/svg2font.exe packages/svg2font-cli/npm/win32-x64/svg2font.exe

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JS packages
        run: |
          pnpm --filter @jayson991/svg2font-cli build
          pnpm --filter @jayson991/svg2font build

      - name: Stamp version into all npm packages
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # CLI platform packages
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            npm version "$VERSION" --no-git-tag-version --prefix packages/svg2font-cli/npm/$pkg
          done

          # svg2font-cli root package + update optionalDependencies
          npm version "$VERSION" --no-git-tag-version --prefix packages/svg2font-cli
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/svg2font-cli/package.json'));
            const v = '$VERSION';
            for (const k of Object.keys(pkg.optionalDependencies)) pkg.optionalDependencies[k] = v;
            fs.writeFileSync('packages/svg2font-cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # svg2font library root package
          npm version "$VERSION" --no-git-tag-version --prefix packages/svg2font

      - name: Publish CLI platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            npm publish packages/svg2font-cli/npm/$pkg/ --access public
          done

      - name: Publish @jayson991/svg2font-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish packages/svg2font-cli/ --access public

      - name: Publish @jayson991/svg2font
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish packages/svg2font/ --access public
